<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1.0" />
<title>SentimentIQ — Stakeholder Brief</title>
<style>
:root{--paper:#f3f1eb;--ink:#1e2a2f;--muted:#687579;--teal:#14a89b;--line:#cbd3cf;--coral:#dc6f62;--mono:"IBM Plex Mono",monospace;--sans:"DM Sans",Arial,sans-serif;--serif:Georgia,serif}
*{box-sizing:border-box} body{margin:0;background:#dfe5e1;font-family:var(--sans);color:var(--ink)} .slide-container{width:1280px;min-height:720px;background:var(--paper);position:relative;overflow:hidden;padding:0 72px}
.topline{position:absolute;left:72px;right:72px;top:42px;border-top:1px solid var(--line);display:flex;justify-content:space-between;padding-top:12px;font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gridline{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.55}.g1{left:245px}.g2{left:480px}.g3{left:715px}.g4{left:950px}
.brand{position:absolute;left:72px;top:87px;font:700 15px var(--sans);letter-spacing:.02em}.brand-mark{display:inline-grid;place-items:center;width:25px;height:25px;border:1px solid var(--teal);border-radius:50%;margin-right:9px;color:var(--teal);font-size:12px}
.hero{position:absolute;left:72px;top:190px;width:650px}.eyebrow{font:11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin-bottom:22px}.hero h1{font:700 76px/0.98 var(--serif);letter-spacing:-.045em;margin:0 0 28px;max-width:650px}.hero p{font:21px/1.35 var(--sans);color:#516064;max-width:470px;margin:0}
.signal{position:absolute;right:72px;top:146px;width:440px;height:420px}.arc{position:absolute;border:1px solid var(--teal);border-left-color:transparent;border-bottom-color:transparent;border-radius:50%;transform:rotate(22deg)}.a1{inset:28px 32px 70px 44px}.a2{inset:86px 90px 118px 102px;border-color:#b9c5c0;border-left-color:transparent;border-bottom-color:transparent}.point{position:absolute;width:10px;height:10px;background:var(--teal);border-radius:50%;right:78px;top:83px}.point2{position:absolute;width:6px;height:6px;background:var(--coral);border-radius:50%;left:109px;bottom:90px}.axis{position:absolute;left:10px;right:0;bottom:48px;border-top:1px dashed var(--line)}.axis span{position:absolute;right:0;top:10px;font:10px var(--mono);color:var(--muted)}
.footer{position:absolute;left:72px;right:72px;bottom:42px;border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;font:10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
</style>
</head>
<body>
<div class="slide-container">
<div class="gridline g1"></div><div class="gridline g2"></div><div class="gridline g3"></div><div class="gridline g4"></div>
<div class="topline"><span>Stakeholder architecture brief</span><span>August 2026</span></div>
<div class="brand"><span class="brand-mark">◒</span>SentimentIQ</div>
<section class="hero"><div class="eyebrow">Customer signal, without the fog</div><h1>SentimentIQ</h1><p>A precise operating view of customer feedback — from imported review to traceable action.</p></section>
<div class="signal"><div class="arc a1"></div><div class="arc a2"></div><div class="point"></div><div class="point2"></div><div class="axis"><span>signal / evidence / control</span></div></div>
<div class="footer"><span>Product scope · architecture · deployment</span><span>Prepared for stakeholders</span></div>
</div>
</body>
</html>
